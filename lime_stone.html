<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://potatowolfie.github.io">
    <meta property="og:title" content="E&W Wiki">
    <meta property="og:description" content="The E&W Wiki is the Wiki for the Minecraft mod, Earth & Water! All information you could possibly need is probably here!">
    <meta property="og:image" content="https://earth-and-water.github.io/assets/wiki/earth_water_wiki.png">
    <meta property="og:image:width" content="2006">
    <meta property="og:image:height" content="736">
    <meta property="og:site_name" content="E&W Wiki">
    <meta name="theme-color" content="#8b4513">
    <meta property="og:locale" content="en_US">
    <title>E&W Wiki</title>
    <link rel="icon" type="image/x-icon" href="wiki_favicon.ico">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.bunny.net/css?family=nunito:200,300,400,500,600,700,800,900" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Minecraft';
            src: url('assets/font/minecraft.woff2') format('woff2'),
                 url('assets/font/minecraft.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Minecraft Ten';
            src: url('assets/fonts/minecraft.woff2') format('woff2'),
                 url('assets/fonts/minecraft.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        img {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .logo img {
            height: 100%;
            width: auto;
            object-fit: contain;
        }

        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
            border: 2px solid #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #48494a;
            border: 2px solid #1a1a1a;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5a5b5c;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: url('assets/wiki/lime_stone_background.png');
            background-color: #2d2d2d;
            background-repeat: repeat;
            background-position: top left;
            font-family: 'Nunito', 'Inter', sans-serif;
            color: #e6e6e6;
            line-height: 1.6;
        }

        .header {
            background: rgba(45, 45, 45, 1.0);
            border-bottom: 3px solid #4a4a4a;
            padding: 15px 0;
            backdrop-filter: blur(10px);
            position: static;
        }

        .header-content {
            max-width: 95vw;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            gap: 15px;
        }

        .logo {
            height: 60px;
            width: auto;
            flex-shrink: 0;
        }

        .search-container {
            flex: 1;
            max-width: 500px;
            margin: 0 20px;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 8px 12px;
            background: #3a3a3a;
            border: none;
            color: #e6e6e6;
            font-size: 14px;
            font-family: 'Nunito', sans-serif;
            border-radius: 4px;
        }

        .search-box:focus {
            outline: 2px solid #0ea394;
            outline-offset: -2px;
        }

        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #31353e;
            border: 2px solid #202125;
            border-top: none;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow:
                inset 2px 2px 0 #3b3e47,
                inset -2px -2px 0 #2e313a;
        }

        .search-suggestion {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #3b3e47;
            color: #cccccc;
            min-height: 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .search-suggestion:hover {
            background: #4f5a75;
        }

        .search-suggestion:hover .suggestion-title {
            color: #0ea394;
        }

        .search-suggestion:last-child {
            border-bottom: none;
        }

        .suggestion-category {
            font-size: 12px;
            color: #0ea394;
            font-family: 'Minecraft Ten', 'Inter', sans-serif;
            font-weight: normal;
        }

        .suggestion-title {
            font-size: 14px;
            margin-top: 2px;
            font-family: 'Nunito', sans-serif;
            color: #cccccc;
        }

        .search-suggestions::-webkit-scrollbar {
            width: 12px;
        }

        .search-suggestions::-webkit-scrollbar-track {
            background: #2e313a;
            border: 2px solid #363b49;
        }

        .search-suggestions::-webkit-scrollbar-thumb {
            background: #4f5a75;
            border: 2px solid #363b49;
        }

        .search-suggestions::-webkit-scrollbar-thumb:hover {
            background: #5a6580;
        }

        /* Infinite scroll filler: an ever-growing spacer div below the header.
           Its height increases as the user nears the bottom, so the page
           (and the tiled background) keeps extending the further you scroll. */
        .scroll-filler {
            width: 100%;
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-content">
        <div class="logo">
            <a href="https://earth-and-water.github.io">
                <img src="assets/wiki/earth_water_wiki.png" alt="Earth & Water Wiki">
            </a>
        </div>
        <div class="search-container">
            <input type="text" class="search-box" placeholder="Search Earth & Water Wiki" id="searchInput" autocomplete="off">
            <div class="search-suggestions" id="searchSuggestions"></div>
        </div>
    </div>
</div>

<div class="scroll-filler" id="scrollFiller"></div>

<script>
    let searchData = {};
    let allSearchItems = [];

    const searchDataFiles = [
        'search-data.json'
    ];

    async function loadSearchData() {
        try {
            const allData = [];
            const cacheBuster = new Date().getTime();

            for (const file of searchDataFiles) {
                try {
                    const response = await fetch(`${file}?v=${cacheBuster}`, {
                        cache: 'no-store',
                        headers: {
                            'Cache-Control': 'no-cache',
                            'Pragma': 'no-cache'
                        }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        const items = Object.values(data).flat();
                        allData.push(...items);
                        console.log(`Loaded search data from ${file}`);
                    }
                } catch (error) {
                    console.warn(`Could not load ${file}:`, error);
                }
            }

            allSearchItems = allData;
            console.log(`Total search items loaded: ${allSearchItems.length}`);
        } catch (error) {
            console.error('Error loading search data:', error);
            allSearchItems = [];
        }
    }

    function initializeSearch() {
        const searchInput = document.getElementById('searchInput');
        const searchSuggestions = document.getElementById('searchSuggestions');

        if (!searchInput || !searchSuggestions) {
            console.error('Search elements not found');
            return;
        }

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();

            if (query.length === 0) {
                searchSuggestions.style.display = 'none';
                return;
            }

            const matches = allSearchItems.filter(item =>
                item.title.toLowerCase().includes(query) ||
                item.category.toLowerCase().includes(query)
            ).slice(0, 8);

            if (matches.length > 0) {
                searchSuggestions.innerHTML = matches.map(item => `
                    <div class="search-suggestion" onclick="navigateToPage('${item.page}')">
                        <div class="suggestion-category">${item.category}</div>
                        <div class="suggestion-title">${item.title}</div>
                    </div>
                `).join('');
                searchSuggestions.style.display = 'block';
            } else {
                searchSuggestions.style.display = 'none';
            }
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-container')) {
                searchSuggestions.style.display = 'none';
            }
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const query = this.value.toLowerCase().trim();
                const firstMatch = allSearchItems.find(item =>
                    item.title.toLowerCase().includes(query) ||
                    item.category.toLowerCase().includes(query)
                );
                if (firstMatch) {
                    navigateToPage(firstMatch.page);
                }
            }
        });
    }

    function navigateToPage(page) {
        if (page.startsWith('http')) {
            window.location.href = page;
        } else {
            window.location.href = 'https://potatowolfie.github.io/' + page;
        }
    }

    // --- Infinite scroll logic ---
    // Grows the filler div whenever the user scrolls near the current
    // bottom of the page, so there's always more page to scroll into,
    // and thus more tiled background revealed. This continues indefinitely.
    const scrollFiller = document.getElementById('scrollFiller');
    const CHUNK_HEIGHT = window.innerHeight * 2; // grow two screens at a time
    const THRESHOLD = window.innerHeight; // start growing when within one screen of the bottom

    function growIfNeeded() {
        const scrollBottom = window.scrollY + window.innerHeight;
        const docHeight = document.documentElement.scrollHeight;

        if (docHeight - scrollBottom < THRESHOLD) {
            const currentHeight = scrollFiller.offsetHeight;
            scrollFiller.style.height = (currentHeight + CHUNK_HEIGHT) + 'px';
        }
    }

    window.addEventListener('scroll', growIfNeeded);
    window.addEventListener('resize', growIfNeeded);

    document.addEventListener('DOMContentLoaded', async function() {
        // Seed enough initial height to make the page scrollable right away.
        scrollFiller.style.height = CHUNK_HEIGHT + 'px';
        growIfNeeded();

        await loadSearchData();
        initializeSearch();
    });
</script>
</body>
</html>
